<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Incidents{% endblock %} · AI Incident Intelligence Platform</title>
{% block head %}{% endblock %}
<style>
  :root {
    color-scheme: light dark;
    --fg: #1a1a1a; --muted: #5f6368; --bg: #f7f7f8; --card: #ffffff; --line: #e2e3e6;
    --accent: #2f6fde; --open: #c5221f; --open-bg: #fce8e6; --ok: #137333; --ok-bg: #e6f4ea;
    --warn: #b06000; --warn-bg: #fef7e0; --code: #f1f3f4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #e8eaed; --muted: #9aa0a6; --bg: #121212; --card: #1c1c1e; --line: #2f3033;
      --accent: #8ab4f8; --open: #f28b82; --open-bg: #3c1f1e; --ok: #81c995; --ok-bg: #1e3326;
      --warn: #fdd663; --warn-bg: #3a2f12; --code: #26272a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--fg); background: var(--bg); }
  header { border-bottom: 1px solid var(--line); background: var(--card); }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 16px; }
  header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 56px; }
  header a.brand { font-weight: 600; color: var(--fg); text-decoration: none; }
  nav a { color: var(--muted); text-decoration: none; margin-left: 16px; }
  nav a:hover, nav a.active { color: var(--fg); }
  main { padding: 24px 0 48px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  h2 { font-size: 1.05rem; margin: 28px 0 10px; }
  a { color: var(--accent); }
  .muted { color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  .pill { display: inline-block; font-size: .78rem; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
  .pill.open, .pill.firing { color: var(--open); background: var(--open-bg); }
  .pill.resolved { color: var(--ok); background: var(--ok-bg); }
  .pill.sev { color: var(--warn); background: var(--warn-bg); }
  .pill.neutral { color: var(--muted); border: 1px solid var(--line); }
  code, pre { font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .kv { display: flex; flex-wrap: wrap; gap: 6px; }
  .kv code { background: var(--code); padding: 1px 6px; border-radius: 4px; }
  .filters { display: flex; gap: 8px; margin: 16px 0; flex-wrap: wrap; }
  .filters a { padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); text-decoration: none; color: var(--muted); background: var(--card); }
  .filters a.active { color: var(--fg); border-color: var(--fg); }
  .empty { padding: 32px; text-align: center; }
  footer { color: var(--muted); font-size: .85rem; padding: 24px 0; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="brand" href="/">AI Incident Intelligence</a>
    <nav>
      <a href="/incidents" {% if nav == "incidents" %}class="active"{% endif %}>Incidents</a>
      <a href="https://github.com/Parrthh/AI-Incident-Intelligence-Platform">GitHub</a>
    </nav>
  </div>
</header>
<main class="wrap">
{% block content %}{% endblock %}
</main>
<footer>
  <div class="wrap">Version {{ version }} · commit <code>{{ commit }}</code> · times in UTC</div>
</footer>
</body>
</html>
