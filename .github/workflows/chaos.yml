name: Chaos run

# Starts the OpenTelemetry Demo with Alertmanager and this platform, breaks a
# service on purpose, and checks that the platform opens, summarizes and resolves
# an incident. Captured Alertmanager payloads are printed as annotations.
#
# Runs on PRs that touch the chaos setup, three times a week, and on demand (any
# scenarios from chaos/scenarios, repeated, for eval snapshots). If the
# IIP_DEMO_WEBHOOK_TOKEN secret is set, alerts are also forwarded to the hosted
# demo, so its public UI shows real incidents.
on:
  pull_request:
    paths:
      - "deploy/demo-env/**"
      - "chaos/**"
      - ".github/workflows/chaos.yml"
  schedule:
    # Mon, Wed, Fri 06:17 UTC: keeps fresh incidents on the public demo.
    - cron: "17 6 * * 1,3,5"
  workflow_dispatch:
    inputs:
      scenarios:
        description: 'Comma-separated scenario names from chaos/scenarios, or "all"'
        default: "payment_failure,payment_unreachable"
      repeat:
        description: "Runs per scenario (snapshots for the eval need 2 or 3)"
        default: "1"
      llm:
        description: "gemini (real summaries and analyses) or fake (saves free-tier quota)"
        default: "gemini"
      forward:
        description: "Forward alerts to the live demo"
        default: "true"

permissions:
  contents: read

concurrency:
  group: chaos-${{ github.ref }}
  cancel-in-progress: true

env:
  OTEL_DEMO_REF: "3.1.0"  # pinned release of open-telemetry/opentelemetry-demo

jobs:
  plan:
    # Turns the inputs into the job matrix: one job per scenario and repeat.
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        env:
          SCENARIOS: ${{ inputs.scenarios || 'payment_failure,payment_unreachable' }}
          REPEAT: ${{ inputs.repeat || '1' }}
        run: |
          matrix=$(python3 chaos/plan_matrix.py)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  scenario:
    name: chaos (${{ matrix.scenario }} ${{ matrix.run }})
    needs: plan
    # Secrets aren't available to fork PRs; skip there instead of failing.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: ${{ (inputs.llm || 'gemini') == 'gemini' && secrets.GEMINI_API_KEY || '' }}
      IIP_DEMO_WEBHOOK_TOKEN: ${{ (inputs.forward || 'true') == 'true' && secrets.IIP_DEMO_WEBHOOK_TOKEN || '' }}
      IIP_IMAGE: iip:chaos
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7

      - name: Free disk space
        # The demo pulls many images; the default runner disk is tight.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /

      - name: Check alert rules
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/deploy/demo-env:/rules:ro" \
            quay.io/prometheus/prometheus:v3.13.1 check rules /rules/prometheus-rules.yml

      - uses: docker/setup-buildx-action@v4
      - name: Build platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IIP_IMAGE }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check out the OpenTelemetry Demo
        run: git clone --depth 1 --branch "$OTEL_DEMO_REF" https://github.com/open-telemetry/opentelemetry-demo.git "$RUNNER_TEMP/otel-demo"

      - name: Choose LLM
        # Real Gemini summaries when the key is available, the fake provider otherwise.
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then echo "IIP_LLM_PROVIDER=gemini" >> "$GITHUB_ENV"; else echo "IIP_LLM_PROVIDER=fake" >> "$GITHUB_ENV"; fi

      - name: Run the scenario
        run: uv run --no-project --with pyyaml python chaos/run.py --demo-dir "$RUNNER_TEMP/otel-demo" --scenario "${{ matrix.scenario }}" --run-dir "$RUNNER_TEMP/chaos-run"

      - name: Stop everything
        if: always()
        working-directory: ${{ runner.temp }}/otel-demo
        run: |
          docker compose --env-file .env --env-file .env.override \
            -f compose.yaml -f compose.observability.yaml -f "$GITHUB_WORKSPACE/deploy/demo-env/compose.iip.yaml" \
            down --volumes --remove-orphans || true
        env:
          IIP_REPO: ${{ github.workspace }}
          IIP_RUN_DIR: ${{ runner.temp }}/chaos-run
