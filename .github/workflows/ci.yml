name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the older run; main always finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  UV_PYTHON: "3.12"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv sync
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format
        run: uv run ruff format --check .

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv sync
      - name: pyright
        run: uv run python scripts/pyright_annotations.py

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: iip
          POSTGRES_PASSWORD: iip-ci-only
          POSTGRES_DB: iip
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U iip -d iip"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      IIP_TEST_DATABASE_URL: postgresql://iip:iip-ci-only@127.0.0.1:5432/iip
      IIP_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      # In CI a missing service is a failure, never a silent skip.
      IIP_REQUIRE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - run: uv sync
      - name: pytest
        # -rs lists skipped tests, so a silently skipped integration suite is visible.
        run: uv run pytest -rs --cov=iip --cov-report=term-missing --cov-report=xml

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: iip
          POSTGRES_PASSWORD: iip-ci-only
          POSTGRES_DB: iip
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U iip -d iip"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: iip:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the image exactly as Render does
        # Same command, production mode, PORT set by the platform, the variable
        # names Render uses, and an sslmode query option like provider URLs have.
        run: |
          docker run -d --name iip --network host \
            -e IIP_ENV=production \
            -e PORT=10000 \
            -e DATABASE_URL="postgresql://iip:iip-ci-only@127.0.0.1:5432/iip?sslmode=disable" \
            -e REDIS_URL="redis://127.0.0.1:6379/0" \
            -e IIP_RUN_WORKER_IN_API=true \
            iip:ci $(python3 -c "import yaml;print(yaml.safe_load(open('render.yaml'))['services'][0]['dockerCommand'])")
      - name: Smoke test
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:10000/healthz; then break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' iip)" != "true" ]; then
              echo "::error::container exited during startup"; exit 1
            fi
            sleep 1
          done
          echo
          curl -fsS http://127.0.0.1:10000/version | tee version.json; echo
          grep -q '"git_sha":"${{ github.sha }}"' version.json
          curl -fsS http://127.0.0.1:10000/readyz | tee readyz.json; echo
          grep -q '"status":"ready"' readyz.json
          # Landing page renders (also proves the HTML template is packaged in the image).
          curl -fsS http://127.0.0.1:10000/ | grep -q "AI Incident Intelligence Platform"
          # Container must not run as root.
          test "$(docker exec iip id -u)" != "0"
      - name: Container logs
        if: always()
        run: docker logs iip || true
